[theme]
# Verde orquídea/botánico para los botones y acentos
primaryColor = "#1ed760"

# Fondo general oscuro y profundo
backgroundColor = "#0a1a12" 

# Fondo secundario (para la barra lateral y tarjetas) ligeramente más claro
secondaryBackgroundColor = "#132a1e" 

# Texto en blanco hueso para contraste suave
textColor = "#fafafa" 

# Fuente moderna y limpia
font = "sans serif"
